name: tickety
description: A ticket/pass manager for .pkpass files
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.1.3
  archive: ^3.6.1
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  dynamic_color: ^1.7.0
  home_widget: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
